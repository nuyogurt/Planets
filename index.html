<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Explore the 8 planets of our Solar System — an interactive, cinematic planet gallery.">
    <meta name="theme-color" content="#05060c">
    <title>The 8 Planets | Solar System Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@300;500;700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="7.png">
</head>

<body>
    <!-- Loader -->
    <div class="loader" id="loader" aria-hidden="true">
        <div class="loader__ring"></div>
        <p>Loading planets <span id="loaderPct">0%</span></p>
    </div>

    <!-- Background -->
    <div class="bg" aria-hidden="true">
        <div class="bg__stars" id="bgStars"></div>
        <div class="bg__glow"></div>
        <canvas class="bg__dust" id="dust"></canvas>
        <div class="bg__vignette"></div>
    </div>

    <!-- Top bar -->
    <header class="topbar">
        <a class="brand" href="#" aria-label="The 8 Planets — home">
            <span class="brand__mark"><i class="ri-planet-line"></i></span>
            <span class="brand__text">
                <strong>The 8 Planets</strong>
                <small>in Our Solar System</small>
            </span>
        </a>
        <div class="topbar__right">
            <button class="chip" id="autoBtn" aria-pressed="true" aria-label="Pause autoplay">
                <i class="ri-pause-line"></i><span>Autoplay</span>
            </button>
            <div class="counter" aria-hidden="true">
                <span class="counter__current" id="counterCurrent">01</span>
                <span class="counter__sep"></span>
                <span class="counter__total">08</span>
            </div>
        </div>
    </header>

    <!-- Main stage -->
    <main class="stage" id="stage">
        <div class="ghost" id="ghost" aria-hidden="true"></div>

        <section class="info" aria-live="polite">
            <p class="eyebrow">
                <span class="eyebrow__num" id="eyebrowNum">01</span>
                <span class="eyebrow__line"></span>
                <span id="eyebrowType">Terrestrial planet</span>
            </p>
            <h1 class="name" id="planetName">Mercury</h1>
            <p class="desc" id="planetDesc"></p>
            <dl class="stats" id="stats"></dl>
        </section>

        <div class="planet-wrap">
            <div class="planet-glow"></div>
            <div class="orbit orbit--a"><span></span></div>
            <div class="orbit orbit--b"><span></span></div>
            <div class="planet" id="planet"></div>
        </div>

        <nav class="index" id="index" aria-label="Planet list"></nav>
    </main>

    <!-- Bottom dock -->
    <footer class="dock">
        <button class="arrow" id="prevBtn" aria-label="Previous planet"><i class="ri-arrow-left-line"></i></button>
        <div class="thumbs" id="thumbs" role="tablist" aria-label="Choose a planet"></div>
        <button class="arrow" id="nextBtn" aria-label="Next planet"><i class="ri-arrow-right-line"></i></button>
        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    </footer>

    <p class="hint" aria-hidden="true">
        <span class="hint--mouse"><kbd>←</kbd><kbd>→</kbd> or scroll to explore</span>
        <span class="hint--touch">Swipe to explore</span>
    </p>

    <script src="script.js"></script>
</body>

</html>
